<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#09090B"/>
  <!-- Gradient orbs -->
  <radialGradient id="g1" cx="30%" cy="40%"><stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25"/><stop offset="100%" stop-color="#09090B" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2" cx="80%" cy="70%"><stop offset="0%" stop-color="#F97316" stop-opacity="0.12"/><stop offset="100%" stop-color="#09090B" stop-opacity="0"/></radialGradient>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- Logo mark -->
  <g transform="translate(80, 72)">
    <circle cx="28" cy="28" r="26" stroke="rgba(124,58,237,0.4)" stroke-width="2.5" fill="none"/>
    <path d="M28 2 A26 26 0 0 1 54 28" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
    <path d="M54 28 A26 26 0 0 1 28 54" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
    <path d="M28 54 A26 26 0 0 1 2 28"  stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
    <circle cx="23" cy="28" r="8" fill="rgba(124,58,237,0.35)"/>
    <circle cx="28" cy="22" r="8" fill="rgba(249,115,22,0.3)"/>
    <circle cx="33" cy="28" r="8" fill="rgba(16,185,129,0.3)"/>
    <line x1="28" y1="28" x2="28" y2="16" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="28" x2="37" y2="33" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="28" cy="28" r="3" fill="white"/>
  </g>

  <!-- Wordmark -->
  <text x="148" y="116" font-family="Inter, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1">klockn</text>

  <!-- Main headline -->
  <text x="80" y="280" font-family="Inter, -apple-system, sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-3">Finally, a time that</text>
  <!-- Gradient text for "everyone." -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  <text x="80" y="380" font-family="Inter, -apple-system, sans-serif" font-size="80" font-weight="900" fill="url(#grad)" letter-spacing="-3">works for everyone.</text>

  <!-- Subtitle -->
  <text x="80" y="460" font-family="Inter, -apple-system, sans-serif" font-size="28" fill="rgba(255,255,255,0.45)" letter-spacing="-0.5">Share your calendar. Let AI find the moment. Book everything.</text>

  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="rgba(124,58,237,0.08)"/>
  <text x="80"  y="611" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="600" fill="rgba(255,255,255,0.4)">klockn.com</text>
  <text x="1120" y="611" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="600" fill="rgba(255,255,255,0.25)" text-anchor="end">Early access open</text>
</svg>
