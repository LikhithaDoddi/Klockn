# CI pipeline — disabled until agents have installed packages and wired up tests
# Re-enable by removing the `if: false` condition on the jobs

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    if: false  # disabled until project is scaffolded
    name: Typecheck, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build shared package
        run: npm run build --workspace=shared
      - name: Typecheck
        run: npm run typecheck --workspaces
      - name: Lint
        run: npm run lint --workspaces
      - name: Test
        run: npm run test --workspaces
