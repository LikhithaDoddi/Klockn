name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build shared package
        run: npm run build --workspace=shared
      # Scoped to the workspaces this repo builds and deploys. web/ runs its own
      # pipeline on Vercel and its test-file types are tracked there; backend's
      # eslint config is not wired yet, so lint is omitted until it is.
      - name: Typecheck
        run: npm run typecheck --workspace=shared --workspace=backend --workspace=ai --workspace=mobile
      - name: Test
        run: npm run test --workspace=backend --workspace=ai --if-present
