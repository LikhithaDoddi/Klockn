name: Deploy Backend

on:
  push:
    branches: [agent/backend]
    paths: [backend/**]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/klockn-backend:$IMAGE_TAG ./backend
          docker push $ECR_REGISTRY/klockn-backend:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/klockn-backend:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to ECS Fargate
        run: |
          aws ecs update-service \
            --cluster klockn \
            --service klockn-backend \
            --force-new-deployment
